name: job_manager
description: "Job Manager — Arabic-first field visit and task tracker."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  shadcn_ui: 0.57.3

  # State + routing
  flutter_riverpod: 3.4.3
  go_router: 18.1.1

  # Networking
  dio: 5.11.1
  web_socket_channel: 3.0.3

  # Local cache / offline outbox
  sqflite: 2.4.5
  path: 1.9.1
  path_provider: 2.1.6

  # Secure session storage
  flutter_secure_storage: 11.2.0

  # Voice input / output
  record: 7.1.2
  flutter_tts: 4.2.5

  # Utilities
  intl: 0.20.3
  uuid: 4.6.0
  url_launcher: 6.3.3
  share_plus: 13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
